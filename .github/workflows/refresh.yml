name: Refresh Spotify widget

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh.yml"
      - "generate_top_image.py"
      - "refresh_widget.py"
      - "requirements.txt"
      - "overrides.json"
  schedule:
    # 毎日 00:00 UTC (= 日本時間 09:00)。GitHub の都合で数分〜十数分ずれることがある。
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # Actions 画面から手動実行も可能

permissions:
  contents: read

concurrency:
  group: spotify-widget-pages
  cancel-in-progress: false

env:
  TIME_RANGE: short_term
  # 一時停止中。false の間はGIF生成・Pages配信を行わず、1位の静止ジャケットを使う。
  ENABLE_GENERATED_TOP_IMAGE: "false"
  OPENAI_VISION_MODEL: gpt-5.6-luna
  OPENAI_IMAGE_MODEL: gpt-image-2
  OPENAI_IMAGE_QUALITY: medium

jobs:
  build-animation:
    runs-on: ubuntu-latest
    outputs:
      animation_available: ${{ steps.animation.outputs.available }}
      relative_path: ${{ steps.animation.outputs.relative_path }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v


      - name: Read current top track
        id: metadata
        if: ${{ env.ENABLE_GENERATED_TOP_IMAGE == 'true' }}
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: >-
          python generate_top_image.py metadata
          --output .animation/metadata.json
          --publication-id ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore generated animation
        id: animation-cache
        if: ${{ env.ENABLE_GENERATED_TOP_IMAGE == 'true' }}
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .animation-cache
          key: >-
            spotify-animation-${{ runner.os }}-
            ${{ steps.metadata.outputs.asset_key }}-
            ${{ hashFiles('generate_top_image.py', 'requirements.txt') }}

      - name: Generate character-motion GIF
        id: animation
        if: ${{ env.ENABLE_GENERATED_TOP_IMAGE == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python generate_top_image.py render
          --metadata .animation/metadata.json
          --cache-dir .animation-cache
          --site-dir _site
          --soft-fail

      - name: Save generated animation
        if: ${{ env.ENABLE_GENERATED_TOP_IMAGE == 'true' && steps.animation.outputs.available == 'true' && steps.animation-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .animation-cache
          key: ${{ steps.animation-cache.outputs.cache-primary-key }}

      - name: Upload Pages artifact
        if: ${{ env.ENABLE_GENERATED_TOP_IMAGE == 'true' && steps.animation.outputs.available == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy-animation:
    needs: build-animation
    if: >-
      ${{
        needs.build-animation.outputs.animation_available == 'true' &&
        github.ref_name == github.event.repository.default_branch
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy generated animation
        id: deployment
        uses: actions/deploy-pages@v4

  refresh-widget:
    needs: [build-animation, deploy-animation]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select top image URL
        id: image-url
        shell: bash
        timeout-minutes: 12
        env:
          DEPLOY_RESULT: ${{ needs.deploy-animation.result }}
          PAGE_URL: ${{ needs.deploy-animation.outputs.page_url }}
          RELATIVE_PATH: ${{ needs.build-animation.outputs.relative_path }}
        run: |
          if [[ "$ENABLE_GENERATED_TOP_IMAGE" != "true" ]]; then
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "Generated animation is disabled; using current top-track album art."
          elif [[ "$DEPLOY_RESULT" == "success" && -n "$PAGE_URL" && -n "$RELATIVE_PATH" ]]; then
            base="${PAGE_URL%/}"
            path="${RELATIVE_PATH#/}"
            url="$base/$path"
            download="$RUNNER_TEMP/top-image.gif"
            ready=false

            for attempt in $(seq 1 60); do
              response="$(
                curl \
                  --location \
                  --silent \
                  --show-error \
                  --connect-timeout 3 \
                  --max-time 5 \
                  --output "$download" \
                  --write-out $'%{http_code}\t%{content_type}' \
                  "$url"
              )" || response=""
              IFS=$'\t' read -r status content_type <<< "$response" || true
              content_type="${content_type,,}"
              signature="$(head -c 6 "$download" 2>/dev/null || true)"

              if [[ "$status" == "200" && "$content_type" == image/gif* ]] &&
                 [[ "$signature" == "GIF87a" || "$signature" == "GIF89a" ]]; then
                ready=true
                echo "Pages GIF ready after attempt $attempt: $url"
                break
              fi

              echo "Waiting for Pages: attempt=$attempt status=${status:-unavailable} type=${content_type:-unknown}"
              if (( attempt < 60 )); then
                sleep 5
              fi
            done

            if [[ "$ready" == "true" ]]; then
              printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Generated GIF did not become ready; using album art."
              echo "url=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "Generated animation unavailable; using album art."
          fi

      - name: Update widget
        env:
          # --- Secrets(機密。リポジトリの Settings → Secrets で登録)---
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # --- 非機密の表示設定(ここで直接編集してよい)---
          TRACK_COUNT: "6"
          WIDGET_TITLE: "Spotify On Repeat"
          WIDGET_SUBTITLE: "直近4週間で最も聴いた曲 Top6"
          # 生成停止中または公開失敗時は空になり、1位のアルバムアートへフォールバックする。
          TOP_IMAGE_URL: ${{ steps.image-url.outputs.url }}
        run: python refresh_widget.py
